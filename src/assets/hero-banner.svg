<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#ec1f8f"/>
      <stop offset="100%" stop-color="#8b3ff0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#heroGrad)" opacity="0.12"/>

  <g transform="translate(60,90)">
    <rect x="0" y="0" width="280" height="180" rx="18" fill="url(#heroGrad)"/>
    <rect x="18" y="26" width="130" height="10" rx="5" fill="url(#cardGrad)"/>
    <rect x="18" y="48" width="90" height="10" rx="5" fill="url(#cardGrad)"/>
    <rect x="18" y="80" width="244" height="70" rx="12" fill="url(#cardGrad)"/>

    <circle cx="238" cy="30" r="10" fill="#ffffff" opacity="0.35"/>
    <circle cx="212" cy="30" r="10" fill="#ffffff" opacity="0.25"/>
    <circle cx="186" cy="30" r="10" fill="#ffffff" opacity="0.2"/>

    <text x="38" y="122" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#ffffff">
      &lt;/&gt;
    </text>
  </g>

  <g transform="translate(230,240)">
    <rect x="0" y="0" width="90" height="60" rx="12" fill="#ffffff" stroke="#eee" stroke-width="2"/>
    <circle cx="20" cy="20" r="6" fill="#ec1f8f"/>
    <rect x="34" y="14" width="44" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="34" y="26" width="30" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="12" y="40" width="66" height="8" rx="4" fill="url(#heroGrad)"/>
  </g>
